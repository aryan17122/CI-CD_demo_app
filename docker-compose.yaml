services:

  postgres:
    image: postgres:17
    container_name: employee-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demo_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  employee-app:
    image: aryan1712/employee-app:latest
    container_name: employee-app

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/demo_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    depends_on:
      - postgres

volumes:
  postgres_data: